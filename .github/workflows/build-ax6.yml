name: Build Campus SY - Redmi AX6

on:
  push:
    branches:
      - redmi-ax6-campus
    paths:
      - 'README.md'
      - 'README-AX6.md'
      - 'configs/**'
      - 'scripts/**'
      - 'files/**'
      - 'assets/**'
      - '.github/workflows/build-ax6.yml'
  workflow_dispatch:
    inputs:
      lede_ref:
        description: 'coolsnowwolf/lede branch or tag'
        required: true
        type: string
        default: master
      ua3f_ref:
        description: 'UA3F branch or tag'
        required: true
        type: string
        default: v3.7.0

permissions:
  contents: read

concurrency:
  group: campus-sy-redmi-ax6
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-ax6:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEVICE_PROFILE: redmi_ax6
      LEDE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.lede_ref || 'master' }}
      UA3F_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ua3f_ref || 'v3.7.0' }}
      ARGON_REF: v3.1.0
      ESURFING_REF: v2.2.1-r7
      UU_REF: v2.2.2
      ZIG_VERSION: '0.13.0'
    steps:
      - name: Checkout Campus SY AX6 profile
        uses: actions/checkout@v4

      - name: Free disk space and install build dependencies
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev python3 python3-dev python3-setuptools \
            python3-pyelftools python3-yaml rsync swig unzip zlib1g-dev file wget curl \
            device-tree-compiler ccache time xsltproc \
            libxml-parser-perl libusb-1.0-0-dev
          df -h

      - name: Install Zig for UU architecture shims
        run: |
          set -euxo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Print selected AX6 build configuration
        run: |
          echo "DEVICE_PROFILE=$DEVICE_PROFILE"
          echo "LEDE_REF=$LEDE_REF"
          echo "UA3F_REF=$UA3F_REF"
          echo "ESURFING_REF=$ESURFING_REF"
          echo "UU_REF=$UU_REF"
          df -h

      - name: Build Campus SY firmware (single build job)
        run: bash ./scripts/build.sh

      - name: Upload AX6 firmware and verification metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CampusSY-Redmi-AX6-LEDE
          path: |
            work/openwrt/bin/targets/qualcommax/ipq807x/*redmi_ax6*
            work/openwrt/bin/targets/qualcommax/ipq807x/BUILD-INFO.txt
            work/openwrt/bin/targets/qualcommax/ipq807x/SHA256SUMS
            work/openwrt/bin/targets/qualcommax/ipq807x/build.config
            work/openwrt/bin/targets/qualcommax/ipq807x/config.buildinfo
            work/openwrt/bin/targets/qualcommax/ipq807x/feeds.buildinfo
            work/openwrt/bin/targets/qualcommax/ipq807x/profiles.json
            work/openwrt/bin/targets/qualcommax/ipq807x/version.buildinfo
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CampusSY-Redmi-AX6-build-diagnostics
          path: |
            work/openwrt/.config
            work/openwrt/logs/**
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
